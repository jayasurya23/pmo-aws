# Builds the static snapshot of the demo and publishes it to GitHub Pages.
# Every run regenerates the synthetic data from scratch, runs the full test suite
# against it, exports the API responses to JSON and builds the React app in
# static mode. One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmo_demo
          POSTGRES_PASSWORD: pmo_demo_local
          POSTGRES_DB: pmo360_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pmo_demo -d pmo360_demo"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://pmo_demo:pmo_demo_local@localhost:5432/pmo360_demo
      TEST_DATABASE_URL: postgresql+psycopg://pmo_demo:pmo_demo_local@localhost:5432/pmo360_demo_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      - name: Generate synthetic data and run the pipeline
        working-directory: backend
        run: python -m pipeline.run --reset

      - name: Run the test suite (separate test database)
        working-directory: backend
        run: |
          PGPASSWORD=pmo_demo_local psql -h localhost -U pmo_demo -d pmo360_demo -c "CREATE DATABASE pmo360_demo_test"
          python -m pytest

      - name: Export the static snapshot
        working-directory: backend
        run: python -m pipeline.export_static

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build the static site
        working-directory: frontend
        env:
          VITE_STATIC: "1"
        run: npx vite build --base ./ --outDir dist-static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
